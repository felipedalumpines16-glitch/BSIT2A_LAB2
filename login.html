<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge Login</title>
  <style>
    :root {
      --font-family: "Inter", "Segoe UI", Arial, sans-serif;
      --background: #eef4ff;
      --text: #1c2333;
      --muted: #667085;
      --soft: #f8faff;
      --line: #ccd7ee;
      --blue: #4f6df5;
      --blue-dark: #1c2b6c;
      --blue-light: #dce4ff;
      --shadow: rgba(26, 44, 84, 0.14);
      --danger: #e85b73;
      --success: #24a36c;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-family);
      color: var(--text);
      background:
        radial-gradient(circle at 75% 10%, rgba(79, 109, 245, 0.1), transparent 20%),
        radial-gradient(circle at 40% 80%, rgba(36, 163, 108, 0.06), transparent 30%),
        var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .login-wrapper {
      width: min(980px, 100%);
      min-height: 620px;
      background: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      box-shadow: 0 25px 80px var(--shadow);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .brand-panel {
      background:
        linear-gradient(135deg, rgba(28, 43, 108, 0.95), rgba(79, 109, 245, 0.92)),
        url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1400&q=80") center center / cover;
      color: #fff;
      padding: 56px 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      right: -80px;
      top: -40px;
      box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.08);
    }

    .brand-top {
      position: relative;
      z-index: 2;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff;
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
    }

    .brand-copy {
      margin-top: 80px;
      position: relative;
      z-index: 2;
    }

    .brand-kicker {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #cad6ff;
      margin-bottom: 16px;
    }

    .brand-copy h1 {
      margin: 0 0 14px;
      font-size: clamp(40px, 4vw, 52px);
      line-height: 1.08;
      font-weight: 800;
      max-width: 370px;
      letter-spacing: -0.04em;
    }

    .brand-copy p {
      max-width: 380px;
      color: rgba(255,255,255,0.78);
      font-size: 16px;
      line-height: 1.8;
      margin: 0 0 30px;
    }

    .brand-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .brand-stats .stat {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 16px;
      border-right: 1px solid rgba(255,255,255,0.35);
    }

    .brand-stats .stat:last-child {
      border-right: none;
    }

    .stat strong {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
    }

    .stat span {
      font-size: 11px;
      color: rgba(255,255,255,0.66);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .login-panel {
      background: var(--soft);
      padding: 50px 46px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-form-box {
      width: min(420px, 100%);
    }

    .form-heading {
      margin-bottom: 30px;
    }

    .form-heading .mini-label {
      display: inline-block;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--blue-light);
      padding: 8px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .form-heading h2 {
      margin: 0 0 12px;
      font-size: clamp(34px, 3vw, 40px);
      font-weight: 800;
      line-height: 1.15;
      color: var(--blue-dark);
      letter-spacing: -0.035em;
    }

    .form-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--blue-dark);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 15px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 260ms ease, box-shadow 260ms ease, transform 260ms ease;
    }

    input::placeholder {
      color: #a3adbd;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(79, 109, 245, 0.12);
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 4px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .remember input {
      accent-color: var(--blue);
      width: 14px;
      height: 14px;
    }

    .forgot {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .primary-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.11em;
      cursor: pointer;
      transition: transform 260ms ease, box-shadow 260ms ease, background 260ms ease;
      box-shadow: 0 14px 30px rgba(79, 109, 245, 0.2);
      margin-top: 22px;
    }

    .primary-btn:hover {
      background: var(--blue-dark);
      box-shadow: 0 18px 34px rgba(28, 43, 108, 0.26);
      transform: translateY(-2px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin: 26px 0 16px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .alt-signin {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--blue-dark);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 260ms ease, color 260ms ease, border-color 260ms ease;
    }

    .alt-signin:hover {
      background: var(--blue-dark);
      color: #fff;
      border-color: var(--blue-dark);
    }

    .signup {
      margin-top: 26px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .signup a {
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    @media (max-width: 820px) {
      .login-wrapper {
        grid-template-columns: 1fr;
      }

      .brand-panel {
        min-height: 360px;
      }

      .brand-copy {
        margin-top: 40px;
      }

      .brand-stats {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="login-wrapper">
    <section class="brand-panel">
      <div class="brand-top">
        <div class="brand-logo">
          <span class="brand-logo-mark">S</span>
          <span>SkillBridge</span>
        </div>
      </div>

      <div class="brand-copy">
        <div class="brand-kicker">Learning Platform</div>
        <h1>Welcome back!</h1>
        <p>Continue your learning journey and access your personalized dashboard.</p>

        <div class="brand-stats">
          <div class="stat">
            <strong>24K+</strong>
            <span>Students</span>
          </div>
          <div class="stat">
            <strong>180+</strong>
            <span>Courses</span>
          </div>
          <div class="stat">
            <strong>96%</strong>
            <span>Growth</span>
          </div>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-form-box">
        <div class="form-heading">
          <span class="mini-label">Student Portal</span>
          <h2>Sign in</h2>
          <p>Enter your account details to continue.</p>
        </div>

        <form>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="field-row">
            <label class="remember">
              <input type="checkbox" name="remember" /> Remember me
            </label>
            <a class="forgot" href="#">Forgot password?</a>
          </div>

          <button class="primary-btn" type="submit">Login to Dashboard</button>
        </form>

        <div class="divider">or continue with</div>

        <button class="alt-signin" type="button">Google</button>

        <div class="signup">
          Don’t have an account? <a href="#">Create one</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
</body>
</html>
